<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D5C43'/%3E%3Cpath d='M16 6C11 11 9 16 9 21a7 7 0 0 0 14 0c0-5-2-10-7-15z' fill='%2310B981' opacity='0.9'/%3E%3Cpath d='M16 9c2.5 3.5 3.5 7 3.5 10.5a3.5 3.5 0 0 1-7 0C12.5 16 13.5 12.5 16 9z' fill='%23F59E0B'/%3E%3Cpath d='M6 24h20' stroke='%23FAFBF9' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSetu — Ayush Academia-Industry Skill Mapping & Placement Ecosystem</title>
    <meta name="description" content="National Ayush academia-industry collaboration platform for skill assessment, gap mapping, practical micro-sprints, verified student portfolios, and industry placements. Ministry of Ayush & All India Institute of Ayurveda." />
    
    <!-- Google Fonts: Inter, Noto Sans Devanagari & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

    <!-- Google MediaPipe Neural Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

    <!-- Govt of India Bhashini (National Language Translation Mission - MeitY) Integration -->
    <!-- Official System Integrator: https://bhashini.gov.in/samudaye/system-integrator -->
    <meta name="bhashini-system-integrator" content="SkillSetu-Ayush-NLTM" />
    <meta name="bhashini-partner-url" content="https://bhashini.gov.in/samudaye/system-integrator" />
    <script 
      id="bhashini-web-plugin"
      src="https://bhashini.gov.in/bhashini-translator.js"
      data-pos-x="95"
      data-pos-y="90"
      data-source-lang="en"
      data-auto-detect="true"
      async defer
      onerror="window.__BHASHINI_NATIVE_READY = true;"
    ></script>

    <!-- Hidden Translation Engine for Full-Page Multilingual Indic Translation -->
    <div id="google_translate_element" style="display:none; visibility:hidden; position:absolute; left:-9999px;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,sa,mr,gu,ta,te,bn,kn,ml,pa,or,as,ur,mai,bho,ne,sd,gom,doi',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script 
      type="text/javascript" 
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
    ></script>
    <script type="text/javascript">
      // Ensure body top remains 0px and translation banner frame stays hidden
      setInterval(function() {
        if (document.body && document.body.style.top && document.body.style.top !== '0px') {
          document.body.style.top = '0px';
        }
        var banner = document.querySelector('.goog-te-banner-frame, iframe.goog-te-banner-frame, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf');
        if (banner) {
          banner.style.display = 'none';
        }
      }, 100);
    </script>

  </head>
  <body class="bg-surface text-on-surface antialiased selection:bg-primary/20 selection:text-primary font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
